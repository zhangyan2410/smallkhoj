name: smallkhoj-prod

services:
  db:
    image: ${SMALLKHOJ_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smallkhoj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside repo}
      POSTGRES_DB: ${POSTGRES_DB:-smallkhoj}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ${SMALLKHOJ_BACKEND_IMAGE:-smallkhoj-backend:latest}
    restart: unless-stopped
    command: sh -c "uv run alembic upgrade head && uv run uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-1}"
    expose:
      - "8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${DEBUG:-false}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:?set PUBLIC_API_KEY outside repo}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smallkhoj}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside repo}@db:5432/${POSTGRES_DB:-smallkhoj}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      BETTER_AUTH_DATABASE_POOL_SIZE: ${BETTER_AUTH_DATABASE_POOL_SIZE:-10}
      BACKEND_WORKERS: ${BACKEND_WORKERS:-1}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
      POSTGRES_CONNECTION_HEADROOM: ${POSTGRES_CONNECTION_HEADROOM:-5}
      NOTIFY_PUBLISHER_POOL_SIZE: ${NOTIFY_PUBLISHER_POOL_SIZE:-2}
      NOTIFY_CONNECT_TIMEOUT_SECONDS: ${NOTIFY_CONNECT_TIMEOUT_SECONDS:-3}
      NOTIFY_OPERATION_TIMEOUT_SECONDS: ${NOTIFY_OPERATION_TIMEOUT_SECONDS:-3}
      NOTIFY_RECONNECT_INITIAL_SECONDS: ${NOTIFY_RECONNECT_INITIAL_SECONDS:-0.25}
      NOTIFY_RECONNECT_MAX_SECONDS: ${NOTIFY_RECONNECT_MAX_SECONDS:-5}
      NOTIFY_SHUTDOWN_TIMEOUT_SECONDS: ${NOTIFY_SHUTDOWN_TIMEOUT_SECONDS:-5}
      NOTIFY_PUBLISH_ATTEMPTS: ${NOTIFY_PUBLISH_ATTEMPTS:-2}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?set AUTH_BRIDGE_SECRET outside repo}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      MINIMUM_DAEMON_VERSION: ${MINIMUM_DAEMON_VERSION:-0.2.0}
      DAEMON_RELEASE_VERSION: ${DAEMON_RELEASE_VERSION:-0.2.1}
      DAEMON_DOWNLOAD_BASE_URL: ${DAEMON_DOWNLOAD_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      FEISHU_REPLY_BASE_URL: ${FEISHU_REPLY_BASE_URL:-https://open.feishu.cn}
      FEISHU_REPLY_ACCESS_TOKEN: ${FEISHU_REPLY_ACCESS_TOKEN:-}
      THREAD_SUMMARY_SCHEDULER_ENABLED: ${THREAD_SUMMARY_SCHEDULER_ENABLED:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      UPLOAD_READ_CHUNK_BYTES: ${UPLOAD_READ_CHUNK_BYTES:-65536}
      UPLOAD_CLEANUP_TIMEOUT_SECONDS: ${UPLOAD_CLEANUP_TIMEOUT_SECONDS:-5}
    depends_on:
      - db

  frontend:
    image: ${SMALLKHOJ_FRONTEND_IMAGE:-smallkhoj-frontend:latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-}
      NEXT_PUBLIC_DEPLOYMENT_ENV: production
      NEXT_PUBLIC_API_KEY: ${PUBLIC_API_KEY:?set PUBLIC_API_KEY outside repo and build the frontend image with the same value}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET outside repo}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public frontend origin}
      BETTER_AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-smallkhoj}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside repo}@db:5432/${POSTGRES_DB:-smallkhoj}
      BETTER_AUTH_DATABASE_POOL_SIZE: ${BETTER_AUTH_DATABASE_POOL_SIZE:-10}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?set AUTH_BRIDGE_SECRET outside repo}
    depends_on:
      - backend

  feishu-worker:
    image: ${SMALLKHOJ_BACKEND_IMAGE:-smallkhoj-backend:latest}
    profiles:
      - feishu-worker
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "feishu_worker_cli"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smallkhoj}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside repo}@db:5432/${POSTGRES_DB:-smallkhoj}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      BETTER_AUTH_DATABASE_POOL_SIZE: ${BETTER_AUTH_DATABASE_POOL_SIZE:-10}
      BACKEND_WORKERS: ${BACKEND_WORKERS:-1}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
      POSTGRES_CONNECTION_HEADROOM: ${POSTGRES_CONNECTION_HEADROOM:-5}
      NOTIFY_PUBLISHER_POOL_SIZE: ${NOTIFY_PUBLISHER_POOL_SIZE:-2}
      FEISHU_WORKER_ENABLED: ${FEISHU_WORKER_ENABLED:-true}
      FEISHU_WORKER_CONNECTOR_ID: ${FEISHU_WORKER_CONNECTOR_ID:-}
      FEISHU_WORKER_JIRA_CONNECTOR_ID: ${FEISHU_WORKER_JIRA_CONNECTOR_ID:-}
      FEISHU_WORKER_CREATOR_ID: ${FEISHU_WORKER_CREATOR_ID:-}
      FEISHU_WORKER_BOT_OPEN_ID: ${FEISHU_WORKER_BOT_OPEN_ID:-}
      FEISHU_WORKER_BOT_NAME: ${FEISHU_WORKER_BOT_NAME:-SmallKhoj}
      FEISHU_WORKER_APP_ID: ${FEISHU_WORKER_APP_ID:-}
      FEISHU_WORKER_APP_SECRET: ${FEISHU_WORKER_APP_SECRET:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      FEISHU_REPLY_BASE_URL: ${FEISHU_REPLY_BASE_URL:-https://open.feishu.cn}
      FEISHU_REPLY_ACCESS_TOKEN: ${FEISHU_REPLY_ACCESS_TOKEN:-}
    depends_on:
      - db
      - backend

  caddy:
    image: ${SMALLKHOJ_CADDY_IMAGE:-smallkhoj-caddy:latest}
    build:
      context: ./deploy/caddy
    restart: unless-stopped
    ports:
      - "${SMALLKHOJ_HTTP_PORT:-80}:80"
      - "${SMALLKHOJ_HTTPS_PORT:-443}:443"
    environment:
      SMALLKHOJ_SITE_ADDRESS: ${SMALLKHOJ_SITE_ADDRESS:-:80}
      SMALLKHOJ_UPLOAD_REQUEST_BODY_MAX: ${SMALLKHOJ_UPLOAD_REQUEST_BODY_MAX:-55MB}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
